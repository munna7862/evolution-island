<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evolution Island</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <h1>Evolution Island</h1>
          <span id="status-badge" class="badge"></span>
        </div>

        <div class="sim-controls" role="group" aria-label="Simulation playback">
          <button id="play-pause-btn" type="button" class="btn btn-primary" aria-pressed="true">
            Pause
          </button>
          <button id="step-btn" type="button" class="btn" title="Advance one tick">Step</button>
          <div id="speed-controls" class="speed-group" role="group" aria-label="Simulation speed">
            <button
              type="button"
              class="btn speed-btn is-active"
              data-speed="1"
              aria-pressed="true"
            >
              1×
            </button>
            <button type="button" class="btn speed-btn" data-speed="2" aria-pressed="false">
              2×
            </button>
            <button type="button" class="btn speed-btn" data-speed="5" aria-pressed="false">
              5×
            </button>
            <button type="button" class="btn speed-btn" data-speed="20" aria-pressed="false">
              20×
            </button>
            <button type="button" class="btn speed-btn" data-speed="max" aria-pressed="false">
              Max
            </button>
          </div>
        </div>

        <div id="event-controls" class="event-group" role="group" aria-label="World events">
          <button
            type="button"
            class="btn event-btn"
            data-event="drought"
            aria-pressed="false"
            title="Click, then click the map: shallow water there dries to sand for a while"
          >
            Drought
          </button>
          <button
            type="button"
            class="btn event-btn"
            data-event="flood"
            aria-pressed="false"
            title="Click, then click the map: land there floods (food lost) for a while"
          >
            Flood
          </button>
          <button
            type="button"
            class="btn event-btn"
            data-event="winter"
            aria-pressed="false"
            title="Winter now: food regrows slowly for a while"
          >
            Winter
          </button>
          <button
            type="button"
            class="btn event-btn"
            data-event="foodZone"
            aria-pressed="false"
            title="Click, then click the map: move the food zone (fast regrowth) there"
          >
            Food zone
          </button>
        </div>

        <form id="map-controls" class="controls">
          <label class="field">
            <span>Preset</span>
            <select id="preset-select" name="preset">
              <option value="small">Small (64×64)</option>
              <option value="medium" selected>Medium (128×128)</option>
              <option value="large">Large (256×256)</option>
              <option value="huge">Huge (512×512)</option>
            </select>
          </label>

          <label class="field">
            <span>Seed</span>
            <input id="seed-input" name="seed" type="text" value="42" spellcheck="false" />
          </label>

          <button id="generate-btn" type="submit" class="btn btn-primary">Generate</button>
          <button id="random-btn" type="button" class="btn">Random</button>

          <label class="toggle">
            <input id="overlays-toggle" type="checkbox" checked />
            <span>Overlays</span>
          </label>

          <button id="reset-view-btn" type="button" class="btn">Reset View</button>
          <button
            id="copy-link-btn"
            type="button"
            class="btn"
            title="Copy a link to this map (preset, seed and simulation version) or trained run"
          >
            Copy link
          </button>
        </form>

        <div class="run-controls" role="group" aria-label="Trained runs">
          <label
            id="featured-field"
            class="field"
            title="Runs trained in advance and published with this site"
          >
            <span>Trained</span>
            <select id="featured-select" name="featured" disabled>
              <option value="">Loading trained runs…</option>
            </select>
          </label>
          <button
            id="load-run-btn"
            type="button"
            class="btn"
            title="Pick a run folder made by pnpm train (or drop it on the map)"
          >
            Load run…
          </button>
          <input id="run-input" type="file" webkitdirectory multiple hidden />
          <button
            id="load-replay-btn"
            type="button"
            class="btn"
            title="Pick a replay file (.replay.json) to play and check bit for bit"
          >
            Load replay…
          </button>
          <input id="replay-input" type="file" accept=".json,application/json" hidden />
          <button
            id="export-replay-btn"
            type="button"
            class="btn"
            title="Save what was played since the start as a replay file"
            hidden
          >
            Export replay
          </button>
          <label id="run-field" class="field" title="The run to watch" hidden>
            <span>Run</span>
            <select id="run-select" name="run"></select>
          </label>
          <label
            id="checkpoint-field"
            class="field"
            title="Gen N: the hall-of-fame champions saved after generation N, on a fresh world of the run's map (not a replay); evolution continues from there"
            hidden
          >
            <span>Saved</span>
            <select id="checkpoint-select" name="checkpoint"></select>
          </label>
          <label
            id="tribe-field"
            class="field"
            title="Watch every tribe, or one tribe's champions alone on its zone"
            hidden
          >
            <span>Tribe</span>
            <select id="tribe-select" name="tribe"></select>
          </label>
          <span id="run-info" class="run-info" role="status"></span>
        </div>
      </header>

      <div class="stage-area">
        <main id="viewport" aria-label="Evolution Island map canvas"></main>
        <div id="drop-overlay" class="drop-overlay" hidden>
          Drop a run folder to watch its champions
        </div>
        <aside id="sim-hud" class="sim-hud" aria-label="Simulation HUD">
          <div class="hud-metrics">
            <span id="hud-tick">Tick 0</span>
            <span id="hud-generation">Gen 1</span>
            <span id="hud-tps">0.0 t/s</span>
            <span id="hud-population">Pop 0</span>
          </div>
          <div id="hud-climate" class="hud-climate" role="status"></div>
          <div id="hud-tribes" class="hud-tribes"></div>
        </aside>
        <aside id="inspector" class="inspector" aria-label="Creature inspector" hidden>
          <div class="insp-head">
            <span id="insp-title"></span>
            <label class="insp-follow" title="Keep the camera on this creature">
              <input id="insp-follow" type="checkbox" /> Follow
            </label>
            <button
              id="insp-close"
              type="button"
              class="btn insp-close"
              aria-label="Close inspector"
            >
              ×
            </button>
          </div>
          <dl id="insp-stats" class="insp-stats"></dl>
          <details class="insp-section" open>
            <summary>Brain</summary>
            <div id="insp-brain" class="insp-bars"></div>
          </details>
          <details class="insp-section">
            <summary>Sensors</summary>
            <div id="insp-inputs" class="insp-bars"></div>
          </details>
        </aside>
        <aside id="dashboard" class="dashboard" aria-label="Tribe dashboard" hidden>
          <div id="dash-generation" class="dash-generation">No generation finished yet</div>
          <table class="dash-table">
            <thead>
              <tr>
                <th scope="col">Tribe</th>
                <th scope="col" title="Creatures alive now">Pop</th>
                <th scope="col" title="Territory, averaged over the last generation">Terr.</th>
                <th scope="col">Kills</th>
                <th scope="col" title="Average fitness in the last generation">Fitness</th>
                <th scope="col" title="Latest champion benchmark score">Bench</th>
              </tr>
            </thead>
            <tbody id="dash-rows"></tbody>
          </table>
          <figure class="dash-chart">
            <figcaption>Average fitness</figcaption>
            <canvas id="chart-fitness" width="280" height="64"></canvas>
          </figure>
          <figure class="dash-chart">
            <figcaption>Benchmark score</figcaption>
            <canvas id="chart-benchmark" width="280" height="64"></canvas>
          </figure>
          <figure class="dash-chart">
            <figcaption>Population</figcaption>
            <canvas id="chart-population" width="280" height="64"></canvas>
          </figure>
          <details class="dash-section" open>
            <summary>Events</summary>
            <ol id="dash-feed" class="dash-feed"></ol>
          </details>
          <details class="dash-section" open>
            <summary id="dash-tree-title">Family tree</summary>
            <div id="dash-tree" class="dash-tree"></div>
          </details>
        </aside>
      </div>

      <footer class="statusbar">
        <div id="map-stats" class="stats"></div>
        <div id="hover-info" class="hover-info">
          Drag to pan · Scroll to zoom · Double-click to fit
        </div>
        <div id="legend" class="legend"></div>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
